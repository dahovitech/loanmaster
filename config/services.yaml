# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    locale: '%env(LOCALE)%'
    app.supported_locales: 'fr|en|es|de|it|pt|nl|pl|da|zh|ja|ar|he'
    app.default_locale: 'fr'

imports:
    - { resource: services_monitoring.yaml }
    - { resource: services_event_sourcing.yaml }
    - { resource: services_graphql.yaml }
    - { resource: services_notification.yaml }
    - { resource: services_ai_ml.yaml }
    - { resource: services_audit_gdpr.yaml }
    - { resource: services_optimization.yaml }

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Application/Service/WorkflowService.php'
            - '../src/Infrastructure/Command/WorkflowManageCommand.php'
            - '../src/Infrastructure/Http/Controller/Api/WorkflowController.php'
            - '../src/Infrastructure/MessageHandler/KycVerificationMessageHandler.php'
            - '../src/Infrastructure/MessageHandler/LoanApprovalMessageHandler.php'
            - '../src/Infrastructure/Security/Service/SecurityService.php'
            - '../src/Infrastructure/Http/Controller/Api/Admin/SecurityAdminController.php'
            - '../src/Infrastructure/Http/Controller/Api/TwoFactorApiController.php'
            - '../src/Infrastructure/Service/RedisConfigurationService.php'
            - '../src/Infrastructure/Command/CacheManageCommand.php'
            - '../src/Service/Notification/MercureNotificationService.php'
            - '../src/Controller/Admin/NotificationAdminController.php'
            - '../src/Service/Notification/Channel/MercureNotificationChannel.php'
            - '../src/Service/Notification/NotificationOrchestrator.php'
            - '../src/EventSubscriber/NotificationEventSubscriber.php'
    
    App\Service\ApiService:
        arguments:
            $apiUrl: '%env(API_URL)%'

    # Services refactorisés pour remplacer Util
    App\Service\Geo\GeolocationService:
        arguments:
            $logger: '@logger'
            $cache: '@cache.app'

    App\Service\Mail\EmailService:
        arguments:
            $logger: '@logger'

    App\Service\Localization\LocalizationService:
        arguments:
            $supportedLocales: '%app.supported_locales%'

    # Configuration des services Oragon
    App\Service\TranslationManagerService:
        arguments:
            $kernel: '@kernel'
            $languageRepository: '@App\Repository\LanguageRepository'
            $entityManager: '@doctrine.orm.entity_manager'
        tags:
            - { name: 'oragon.translation.manager' }

    # Extension Twig pour les traductions Oragon
    App\Twig\TranslationExtension:
        arguments:
            $translationManager: '@App\Service\TranslationManagerService'
            $languageRepository: '@App\Repository\LanguageRepository'
            $requestStack: '@request_stack'
        tags:
            - { name: 'twig.extension' }

    # Commandes CLI Oragon
    App\Command\SyncTranslationsCommand:
        arguments:
            $translationManager: '@App\Service\TranslationManagerService'
            $languageRepository: '@App\Repository\LanguageRepository'
        tags:
            - { name: 'console.command' }

    App\Command\MigrateGedmoToOragonCommand:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $pageRepository: '@App\Repository\PageRepository'
            $seoRepository: '@App\Repository\SeoRepository'
            $languageRepository: '@App\Repository\LanguageRepository'
            $translatableListener: '@stof_doctrine_extensions.listener.translatable'
        tags:
            - { name: 'console.command' }

    # Contrôleur d'administration des traductions
    App\Controller\Admin\TranslationController:
        arguments:
            $translationManager: '@App\Service\TranslationManagerService'
            $languageRepository: '@App\Repository\LanguageRepository'

    # Exception Subscriber avec configuration d'environnement
    App\EventSubscriber\ExceptionSubscriber:
        arguments:
            $logger: '@logger'
            $twig: '@twig'
            $environment: '%kernel.environment%'

    # Repository interface aliases
    App\Domain\Repository\LoanRepositoryInterface: '@App\Infrastructure\Repository\LoanRepositoryOptimized'
    App\Domain\Repository\UserRepositoryInterface: '@App\Infrastructure\Repository\UserRepositoryOptimized'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones