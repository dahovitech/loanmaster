# config/packages/messenger.yaml
framework:
    messenger:
        # Configuration des transports
        transports:
            # Transport simple pour éviter les erreurs de configuration
            async:
                dsn: 'doctrine://default'

        # Configuration du routage des messages
        routing:
            # Messages normaux - transport par défaut
            '*': async

        # Configuration des handlers par défaut
        default_bus: messenger.bus.default
        
        # Configuration des bus
        buses:
            messenger.bus.default:
                default_middleware: true
                middleware:
                    - doctrine_ping_connection
                    - doctrine_close_connection
                    - validation
                    - 'App\Infrastructure\Messenger\Middleware\AuditMiddleware'
                    - 'App\Infrastructure\Messenger\Middleware\MetricsMiddleware'

        # Configuration des workers
        failure_transport: async

# Configuration spécifique par environnement
when@prod:
    framework:
        messenger:
            transports:
                async_priority_high:
                    options:
                        prefetch_count: 5  # Limitation pour éviter la surcharge
                async:
                    options:
                        prefetch_count: 10
                notifications:
                    options:
                        prefetch_count: 20
                reports:
                    options:
                        prefetch_count: 2  # Reports sont plus lourds
                maintenance:
                    options:
                        prefetch_count: 1

when@dev:
    framework:
        messenger:
            transports:
                # En dev, utiliser le transport sync pour debug
                async_priority_high:
                    dsn: 'sync://'
                async:
                    dsn: 'doctrine://default'
                notifications:
                    dsn: 'doctrine://default'
                failed:
                    dsn: 'doctrine://default'

when@test:
    framework:
        messenger:
            transports:
                async_priority_high:
                    dsn: 'in-memory://'
                async:
                    dsn: 'in-memory://'
                notifications:
                    dsn: 'in-memory://'
                reports:
                    dsn: 'in-memory://'
                maintenance:
                    dsn: 'in-memory://'
                webhooks:
                    dsn: 'in-memory://'
                failed:
                    dsn: 'in-memory://'
